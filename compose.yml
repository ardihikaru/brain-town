# Brain Town — one static web service. Run one compose project per environment:
#
#   ENV_FILE=.env.demo docker compose -p brain-town-demo --env-file .env.demo up -d --build
#   ENV_FILE=.env.prod docker compose -p brain-town-prod --env-file .env.prod up -d --build
#
# Locally, with no env file at all: `docker compose up --build` → http://127.0.0.1:8080
name: brain-town

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: brain-town-web:${BRAIN_TOWN_MODE:-local}
    restart: unless-stopped
    # Runtime settings (mode, public URL). Only the api service reads the admin credentials.
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    mem_limit: 64m
    pids_limit: 64
    depends_on:
      - api

  # Back-office API: admin API, ingest endpoints and the /events SSE streams.
  # Not published on the host: the web service proxies /api/, /ingest/, /events and /admin/events to it.
  api:
    build:
      context: backend
    image: brain-town-api:${BRAIN_TOWN_MODE:-local}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8081"
      ARCADEDB_URL: ${ARCADEDB_URL:-}
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE:-braintown}
      ARCADEDB_USER: ${ARCADEDB_USER:-}
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:-}
      BRAIN_TOWN_MODE: ${BRAIN_TOWN_MODE:-demo}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      INGEST_RATE: ${INGEST_RATE:-50}
      INGEST_BURST: ${INGEST_BURST:-200}
      BRAIN_TOWN_SECRET_KEY: ${BRAIN_TOWN_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in the env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in the env file}
    read_only: true
    mem_limit: 64m
    pids_limit: 64

  # Local/demo ArcadeDB, only with `--profile db`. Production uses the existing ArcadeDB
  # (set ARCADEDB_URL to it) and does not run this service.
  arcadedb:
    profiles: ["db"]
    image: arcadedata/arcadedb:26.7.2
    restart: unless-stopped
    environment:
      # Only used with --profile db: set ARCADEDB_PASSWORD (the root password), or the server will not start.
      JAVA_OPTS: "-Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:-}"
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    mem_limit: 1g

volumes:
  arcadedb-data:
