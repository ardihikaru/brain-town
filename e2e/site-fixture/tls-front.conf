# https front for the mfardiansyah.id services of the e2e stack. The real site only talks https, and Brain Town's
# puller only pulls https, so two names on one throwaway-CA certificate bridge them:
#   brain-town-tls  site -> Brain Town ingest (the stack's web container)
#   site-pull-tls   Brain Town api -> the site's real /feed.json (the pull instance)
# Upstreams resolve lazily through Docker's DNS, so the start order of the services does not matter.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8443 ssl default_server;
    server_name brain-town-tls;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/front.crt;
    ssl_certificate_key /etc/nginx/tls/front.key;

    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}

server {
    listen 8443 ssl;
    server_name site-pull-tls;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/front.crt;
    ssl_certificate_key /etc/nginx/tls/front.key;

    location / {
        set $upstream http://site-api-pull:8121;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
