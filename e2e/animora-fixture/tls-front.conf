# https front for the Animora pieces of the e2e stack. The real sender only talks https, and Brain Town's puller only
# pulls https, so two names on one throwaway-CA certificate bridge them:
#   animora-brain-town-tls  sender -> Brain Town ingest (the stack's web container)
#   animora-pull-tls        Brain Town api -> the real Animora server's /feed.json
# Upstreams resolve lazily through Docker's DNS, so the start order of the services does not matter.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8443 ssl default_server;
    server_name animora-brain-town-tls;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/front.crt;
    ssl_certificate_key /etc/nginx/tls/front.key;

    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}

server {
    listen 8443 ssl;
    server_name animora-pull-tls;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/front.crt;
    ssl_certificate_key /etc/nginx/tls/front.key;

    location / {
        set $upstream http://animora-server:8787;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
