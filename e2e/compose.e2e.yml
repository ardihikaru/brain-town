# E2E-only additions to ../compose.yml. Used only by e2e/scripts/stack.sh (compose project
# brain-town-e2e, 127.0.0.1 only). Never used for the demo or production deployment.
#
#   docker compose -p brain-town-e2e --project-directory . -f compose.yml -f e2e/compose.e2e.yml \
#     --env-file e2e/env/.env.local --profile db up -d --build
x-site-api-env: &site-api-env
  ARCADEDB_URL: http://arcadedb:2480
  ARCADEDB_USER: root
  ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:-}
  LISTEN: ':8121'
  GRPC_LISTEN: 'off'
  WEB_ORIGIN: http://site-web:8080
  ADMIN_USER: ${SITE_ADMIN_USER:-e2e-admin}
  ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-}
  ADMIN_BASIC_ENABLED: 'true'
  SESSION_SECURE: 'false'
  # Local only: trust X-Real-IP from any peer so specs can pick the visitor IP (the site's default trusts one edge).
  TRUSTED_PROXY_CIDRS: '0.0.0.0/0,::/0'
  GEOIP_DB: /geo/e2e-country.mmdb
  SSL_CERT_FILE: /e2e-tls/ca.crt
  BRAIN_TOWN_ENABLED: 'true'

services:
  api:
    environment:
      # Pull site feeds every few seconds instead of every 5 minutes, so the feed spec needs no long wait.
      FEED_PULL_INTERVAL_SECONDS: ${FEED_PULL_INTERVAL_SECONDS:-300}
      # The api image is scratch (no CA bundle). Go's crypto/x509 reads trust roots from SSL_CERT_FILE,
      # so the throwaway test CA that signed the feed fixture's certificate is trusted without a code change.
      SSL_CERT_FILE: /e2e-tls/ca.crt
    volumes:
      - ./e2e/.stack/tls/ca.crt:/e2e-tls/ca.crt:ro

  # Serves JSON Feed files written by the feed spec over https, inside the compose network only.
  feed-fixture:
    image: nginx:1.30.7-alpine3.24
    volumes:
      - ./e2e/feed-fixture/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./e2e/.stack/tls:/etc/nginx/tls:ro
      - ./e2e/.stack/feed:/usr/share/nginx/feed:ro
    mem_limit: 64m
    pids_limit: 64

  # ── mfardiansyah.id both-sides services (profile "site") ─────────────────────────────────────────────
  # The site's real web image and Go api, built from a clean `git archive` of the site repo that scripts/stack.sh
  # exports to e2e/.stack/site/src. Throwaway databases in the stack's ArcadeDB, no LinkedIn/AI/Redis. Never used outside
  # the e2e stack. The site runs with a GeoIP file written by site-init, and trusts X-Real-IP from anywhere (local only),
  # so specs pick the visitor country per worker.

  # One-shot: GeoIP file into the shared volume, site databases (schema, migrations, seed) in ArcadeDB.
  site-init:
    profiles: ['site']
    build:
      context: ./e2e/site-fixture/init
    environment:
      ARCADEDB_URL: http://arcadedb:2480
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:-}
      GEO_OUT: /geo/e2e-country.mmdb
      SITE_DB_DIR: /site-db
    volumes:
      - site-geo:/geo
      - ./e2e/.stack/site/src/backend/db:/site-db:ro
    depends_on:
      - arcadedb
    restart: 'no'
    mem_limit: 64m

  site-web:
    profiles: ['site']
    build:
      context: ./e2e/.stack/site/src
    ports:
      - '127.0.0.1:18284:8080'
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    mem_limit: 64m
    pids_limit: 64

  # Push instance: publishes to the stack-owned "e2e-site-push" integration (no feedUrl, so only pushes reach it).
  site-api:
    profiles: ['site']
    build:
      context: ./e2e/.stack/site/src/backend
    env_file:
      - path: ./e2e/.stack/site/push.env
        required: false
    environment:
      <<: *site-api-env
      ARCADEDB_DB: site_push
      SITE_URL: http://127.0.0.1:18281
    ports:
      - '127.0.0.1:18281:8121'
    volumes: &site-api-volumes
      - site-geo:/geo:ro
      - ./e2e/.stack/tls/ca.crt:/e2e-tls/ca.crt:ro
    depends_on: &site-api-depends
      site-init:
        condition: service_completed_successfully
      site-web:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 128

  # Pull instance: same pushes to "e2e-site-pull"; Brain Town's puller also reads its real /feed.json over https.
  site-api-pull:
    profiles: ['site']
    build:
      context: ./e2e/.stack/site/src/backend
    env_file:
      - path: ./e2e/.stack/site/pull.env
        required: false
    environment:
      <<: *site-api-env
      ARCADEDB_DB: site_pull
      SITE_URL: http://127.0.0.1:18283
    ports:
      - '127.0.0.1:18283:8121'
    volumes: *site-api-volumes
    depends_on: *site-api-depends
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 128

  # Brain Town unreachable: a closed port on the https front (connection refused), placeholder token.
  site-api-offline:
    profiles: ['site']
    build:
      context: ./e2e/.stack/site/src/backend
    environment:
      <<: *site-api-env
      ARCADEDB_DB: site_offline
      SITE_URL: http://127.0.0.1:18282
      BRAIN_TOWN_URL: https://brain-town-tls:9/ingest/site/unreachable
      BRAIN_TOWN_TOKEN: e2e-placeholder-not-a-secret
    ports:
      - '127.0.0.1:18282:8121'
    volumes: *site-api-volumes
    depends_on: *site-api-depends
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 128

  # https front: brain-town-tls (site -> Brain Town ingest) and site-pull-tls (Brain Town puller -> real site feed).
  tls-front:
    profiles: ['site']
    image: nginx:1.30.7-alpine3.24
    networks:
      default:
        aliases:
          - brain-town-tls
          - site-pull-tls
    volumes:
      - ./e2e/site-fixture/tls-front.conf:/etc/nginx/conf.d/default.conf:ro
      - ./e2e/.stack/tls:/etc/nginx/tls:ro
    mem_limit: 64m
    pids_limit: 64

  # ── Animora both-sides services (profile "animora") ─────────────────────────────────────────────────
  # The real Animora Go server (built from a clean `git archive` of the Animora repo that scripts/stack.sh exports to
  # e2e/.stack/animora/src) on a throwaway database in the stack's ArcadeDB, and the real naskah-to-video sender run
  # once as a one-shot container. Nothing here is used outside the e2e stack.

  animora-init:
    profiles: ['animora']
    image: python:3.13-alpine
    command: ['python', '-I', '/create-db.py']
    environment:
      ARCADEDB_URL: http://arcadedb:2480
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:-}
      ANIMORA_DB: animora_e2e
    volumes:
      - ./e2e/animora-fixture/create-db.py:/create-db.py:ro
    depends_on:
      - arcadedb
    restart: 'no'
    mem_limit: 64m

  # Seeded through its own write API by animora-fixture/provision.mjs (a random per-stack ANIMORA_API_TOKEN).
  animora-server:
    profiles: ['animora']
    build:
      context: ./e2e/.stack/animora/src/server
      dockerfile: ../deploy/Dockerfile.server
    env_file:
      - path: ./e2e/.stack/animora/server.env
        required: false
    environment:
      ANIMORA_ADDR: ':8787'
      ANIMORA_ARCADE_URL: http://arcadedb:2480
      ANIMORA_ARCADE_DB: animora_e2e
      ANIMORA_ARCADE_USER: root
      ANIMORA_ARCADE_PASSWORD: ${ARCADEDB_PASSWORD:-}
      ANIMORA_BRAIN_TOWN_ENABLED: 'false'
    ports:
      - '127.0.0.1:18285:8787'
    depends_on:
      animora-init:
        condition: service_completed_successfully
    read_only: true
    mem_limit: 128m
    pids_limit: 128

  # https front: animora-brain-town-tls (sender -> Brain Town ingest) and animora-pull-tls (Brain Town puller -> server).
  animora-front:
    profiles: ['animora']
    image: nginx:1.30.7-alpine3.24
    networks:
      default:
        aliases:
          - animora-brain-town-tls
          - animora-pull-tls
    volumes:
      - ./e2e/animora-fixture/tls-front.conf:/etc/nginx/conf.d/default.conf:ro
      - ./e2e/.stack/tls:/etc/nginx/tls:ro
    mem_limit: 64m
    pids_limit: 64

  # One-shot, started by stack.sh with `compose run`: the real `python -m app.braintown send` for each envelope in
  # .stack/animora/events. ANIMORA_NV_BRAIN_TOWN_* come from .stack/animora/sender.env (mode 600, never printed).
  animora-sender:
    profiles: ['animora-run']
    image: python:3.13-alpine
    working_dir: /nv
    command: ['sh', '/send.sh']
    env_file:
      - path: ./e2e/.stack/animora/sender.env
        required: false
    environment:
      SSL_CERT_FILE: /e2e-tls/ca.crt
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ./e2e/animora-fixture/send.sh:/send.sh:ro
      - ./e2e/.stack/animora/src/naskah-to-video:/nv:ro
      - ./e2e/.stack/animora/events:/events:ro
      - ./e2e/.stack/tls/ca.crt:/e2e-tls/ca.crt:ro
    depends_on:
      - animora-front
    mem_limit: 64m

volumes:
  site-geo:
