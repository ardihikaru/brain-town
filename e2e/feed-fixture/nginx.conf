# Feed fixture for the e2e feed-puller spec: static JSON Feed files over https (test CA).
server {
    listen 8443 ssl;
    server_name feed-fixture;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    root /usr/share/nginx/feed;
    location / {
        default_type application/feed+json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
