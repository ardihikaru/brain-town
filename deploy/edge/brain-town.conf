# Brain Town — public edge vhost. REFERENCE COPY.
#
# The live file is /etc/nginx/conf.d/brain-town.conf on the author's edge box (`clino`),
# and that box is the source of truth. Keep this copy in step by hand after any edit there.
# Edge: nginx.org 1.30.7 (held). `http2 on;` syntax, not `listen ... http2`.
#
#   sudo cp /etc/nginx/conf.d/brain-town.conf{,.bak.$(date +%Y%m%d%H%M%S)}
#   sudo nginx -t && sudo systemctl reload nginx
#
# PORT SLOT. Shared register 1<environment><product><instance>: 18xxx prod, 19xxx dev.
# All ten product slots are taken; like Talent Atlas (18201), Brain Town BORROWS cubiq's
# slot 02 on 10.10.0.4 (cubiq runs on 10.10.0.5), as instance 2:
#   prod  town.mfardiansyah.id       -> 10.10.0.4:18202
#   demo  town.demo.mfardiansyah.id  -> 10.10.0.4:19202
# If cubiq ever moves onto 10.10.0.4, these must move first.
#
# Certificates (HTTP-01; one lineage per host so one broken name never blocks the other):
#   sudo certbot certonly --webroot -w /var/www/acme --cert-name brain-town \
#     -d town.mfardiansyah.id --agree-tos --non-interactive \
#     --deploy-hook 'nginx -t && systemctl reload nginx'
#   sudo certbot certonly --webroot -w /var/www/acme --cert-name brain-town-demo \
#     -d town.demo.mfardiansyah.id --agree-tos --non-interactive \
#     --deploy-hook 'nginx -t && systemctl reload nginx'

# Map names are GLOBAL across conf.d: a collision breaks every product's reload. Prefix brain_town_.
map $host $brain_town_backend {
    hostnames;
    town.mfardiansyah.id       10.10.0.4:18202;
    town.demo.mfardiansyah.id  10.10.0.4:19202;
    default                    "";
}

limit_req_zone $binary_remote_addr zone=brain_town_web:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name town.mfardiansyah.id town.demo.mfardiansyah.id;
    server_tokens off;

    # The only path Let's Encrypt has to renew the certificates. Never delete it.
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name town.mfardiansyah.id;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/brain-town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain-town/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($brain_town_backend = "") { return 444; }

    # No includeSubDomains: other *.mfardiansyah.id services live on this edge.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header X-Content-Type-Options;

    location / {
        limit_req zone=brain_town_web burst=60 nodelay;
        proxy_pass http://$brain_town_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        # Room for the planned /events SSE stream.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name town.demo.mfardiansyah.id;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/brain-town-demo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain-town-demo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($brain_town_backend = "") { return 444; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;
    proxy_hide_header X-Content-Type-Options;

    location / {
        limit_req zone=brain_town_web burst=60 nodelay;
        proxy_pass http://$brain_town_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
