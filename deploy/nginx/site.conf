# Brain Town container vhost. TLS, HSTS and the public hostname are the edge's job.

# Public origin as the visitor sees it: the edge forwards Host and X-Forwarded-Proto.
# The edge may send X-Forwarded-Proto more than once; nginx then joins the values ("https, https"),
# so match on the first value instead of the whole string.
map $http_x_forwarded_proto $bt_scheme { default $scheme; ~^https https; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    absolute_redirect off;   # relative Location, so redirects keep https behind the edge
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Both pages are single HTML files: revalidate on every load so a deploy shows at once.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Link-preview tags (og:url, og:image, twitter:image) are written with the production origin.
    # Demo and prod serve the same HTML, so rewrite them to the host that was asked for.
    sub_filter 'content="https://town.mfardiansyah.id/' 'content="$bt_scheme://$http_host/';
    sub_filter_once off;

    # Back-office API. The variable + resolver keep nginx starting (static demo) when the api is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /api/ { set $api http://api:8081; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; client_max_body_size 128k; }
    location ^~ /ingest/ { set $api http://api:8081; proxy_pass $api; proxy_set_header Host $host; client_max_body_size 128k; }
    # Server-sent events: no buffering, long read timeout.
    location ~ ^/(events|admin/events)$ {
        set $api http://api:8081;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Town at /, back-office at /backoffice/.
    location = /           { try_files /index.html =404; }
    location = /backoffice { return 301 /backoffice/; }
    location ^~ /backoffice/ { try_files $uri /backoffice/index.html; }

    # Brand assets: files change rarely, so let browsers keep them for a week. A location-level
    # add_header replaces the server-level ones, so nosniff is repeated here. Without "always" the
    # week-long cache applies to found files only, never to a 404.
    location ~ ^/(favicon\.ico|apple-touch-icon\.png|brand/.+)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / { try_files $uri =404; }
}
