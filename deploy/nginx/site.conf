# Brain Town container vhost. TLS, HSTS and the public hostname are the edge's job.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    absolute_redirect off;   # relative Location, so redirects keep https behind the edge
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Both pages are single HTML files: revalidate on every load so a deploy shows at once.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Back-office API. The variable + resolver keep nginx starting (static demo) when the api is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /api/ { set $api http://api:8081; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; client_max_body_size 128k; }
    location ^~ /ingest/ { set $api http://api:8081; proxy_pass $api; proxy_set_header Host $host; client_max_body_size 128k; }
    # Server-sent events: no buffering, long read timeout.
    location ~ ^/(events|admin/events)$ {
        set $api http://api:8081;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Town at /, back-office at /backoffice/.
    location = /           { try_files /index.html =404; }
    location = /backoffice { return 301 /backoffice/; }
    location ^~ /backoffice/ { try_files $uri /backoffice/index.html; }

    location / { try_files $uri =404; }
}
